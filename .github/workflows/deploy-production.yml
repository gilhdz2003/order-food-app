# Production Deploy - OrderFood Online
name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Build project
        run: npm run build

      - name: Deploy to Hostinger
        run: |
          echo "Deploying to Hostinger..."
          echo "This is where you would add your deploy script"
          echo "For now, this is a placeholder"
          echo "In production, use Hostinger's GitHub integration"

      - name: Notify deployment
        if: success()
        run: echo "✅ Deploy successful to production"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deploy failed"
